# ============================================================
#  Application Configuration
#  Code-First: Hibernate reads @Entity classes and generates
#  the DB schema automatically (ddl-auto=update).
#  For production replace H2 with MySQL/PostgreSQL and use
#  Flyway or Liquibase for controlled schema migrations.
# ============================================================

spring.application.name=role-based-mobile-app

# --- H2 In-Memory Database (replace with production DB) ---
spring.datasource.url=jdbc:h2:mem:rbacdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate (Code-First) ---
# update  → Hibernate creates/alters tables on startup to match entities (dev/demo)
# validate → only validates schema matches entities (staging)
# none    → do nothing, use Flyway/Liquibase (production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Secret must be at least 256 bits (32 chars).
# In production, override via environment variable:  APP_JWT_SECRET=<strong-random-value>
app.jwt.secret=${APP_JWT_SECRET:fawry-rbac-secret-key-change-in-production-2024}
app.jwt.expiration-ms=86400000

# --- Server ---
server.port=8080
